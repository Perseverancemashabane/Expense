services:
  # Backend Express Service on Render
  - type: web
    name: student-budget-tracker-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: student-budget-db
          property: connectionString
      - key: SMTP_USER
        value: naledimashabane001@gmail.com
      - key: SMTP_PASS
        value: saqs avgu cgpy ibvj

databases:
  # Managed PostgreSQL Database on Render
  - name: student-budget-db
    plan: free
    databaseName: student_budget
    user: budget_admin

